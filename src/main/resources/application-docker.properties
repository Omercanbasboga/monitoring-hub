# Postgres profile: run with `--spring.profiles.active=docker` and provide
# every ${...} value below as an environment variable. Nothing here has a
# baked-in default value on purpose -- there are no real credentials in this
# repository, ever.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

server.port=8082
server.address=0.0.0.0

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

connectors.rest.base-url=${REST_SOURCE_BASE_URL:}
connectors.csv.feed-url=${CSV_SOURCE_FEED_URL:}
connectors.ftp-delimited.host=${FTP_DELIMITED_HOST:}
connectors.ftp-delimited.username=${FTP_DELIMITED_USERNAME:}
connectors.ftp-delimited.password=${FTP_DELIMITED_PASSWORD:}
connectors.ftp-binary.host=${FTP_BINARY_HOST:}
connectors.ftp-binary.username=${FTP_BINARY_USERNAME:}
connectors.ftp-binary.password=${FTP_BINARY_PASSWORD:}

spring.jackson.time-zone=UTC
