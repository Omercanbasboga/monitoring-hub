spring.application.name=monitoring-hub

# Default profile runs entirely in-memory (H2) so the service starts with zero
# setup. Switch to `docker` (application-docker.properties) for Postgres.
spring.datasource.url=jdbc:h2:mem:monitoringhub;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8082
server.address=0.0.0.0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Every connector below is OPT-IN: leave the URL/host blank (the default) and
# that connector simply stays idle. Fill in real values via environment
# variables to point it at a real feed -- see README "Configuration".
connectors.rest.base-url=${REST_SOURCE_BASE_URL:}
connectors.rest.record-limit=${REST_SOURCE_RECORD_LIMIT:10000}
connectors.rest.mode=${REST_SOURCE_MODE:json}

connectors.csv.feed-url=${CSV_SOURCE_FEED_URL:}

connectors.ftp-delimited.host=${FTP_DELIMITED_HOST:}
connectors.ftp-delimited.username=${FTP_DELIMITED_USERNAME:}
connectors.ftp-delimited.password=${FTP_DELIMITED_PASSWORD:}
connectors.ftp-delimited.file-suffix=${FTP_DELIMITED_FILE_SUFFIX:.dat}

connectors.ftp-binary.host=${FTP_BINARY_HOST:}
connectors.ftp-binary.port=${FTP_BINARY_PORT:21}
connectors.ftp-binary.username=${FTP_BINARY_USERNAME:}
connectors.ftp-binary.password=${FTP_BINARY_PASSWORD:}
connectors.ftp-binary.passive=${FTP_BINARY_PASSIVE:true}

spring.jackson.time-zone=UTC
spring.main.banner-mode=off
